name: Deploy Telegram alerts

on:
  push:
    branches: [main]
    paths: ['telegram-bot/**', 'roster-engine.js', 'firebase-config.js', '.github/workflows/telegram-bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Check secrets
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$CF" ] || [ -z "$TG" ]; then
            echo "::warning::Not deployed yet. Add CLOUDFLARE_API_TOKEN and TELEGRAM_BOT_TOKEN under Settings → Secrets and variables → Actions (see README)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare
        if: env.SKIP != '1'
        working-directory: telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node provision-kv.mjs
          npx wrangler deploy | tee deploy.log
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker address: $URL"
          sleep 5
          curl -fsS "$URL/setup" && echo
