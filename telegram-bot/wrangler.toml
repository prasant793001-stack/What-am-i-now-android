# Cloudflare Worker for Telegram role alerts. Deployed automatically by GitHub Actions
# (.github/workflows/telegram-bot.yml), which also fills in the KV id below.
name = "what-am-i-now-telegram"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]   # every minute

[vars]
TZ_OFFSET_MINUTES = "240"   # Dubai, UTC+4
LEAD_MINUTES = ""           # empty = use the roster's "Alert before each role change" setting

[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID"
