<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BC Al Ain Routine</title>
<meta name="theme-color" content="#0B0B10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BC Routine">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#14201D; --muted:#5B6A66; --line:#D9E1DF;
  --primary:#0E6B5C; --primary-ink:#FFFFFF; --accent:#F0B429; --accent-ink:#2A1E00;
  --mine:#D6F0E9; --mine-ink:#0A4A3F; --now:#FFF4D6; --red:#D93025; --red-bg:#FDE7E5; --brk:#F2EEE4; --danger:#B3402F; --danger-bg:#FBE5E1;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 8px 24px rgba(20,32,29,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#15201D; --sunk:#111A18; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --primary:#38BFA4; --primary-ink:#04211B; --accent:#F4C542; --accent-ink:#2A1E00;
  --mine:#173B33; --mine-ink:#BFF0E3; --now:#2E2810; --red:#FF6B5E; --red-bg:#3A1714; --brk:#1C2420; --danger:#F08A78; --danger-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#15201D; --sunk:#111A18; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --primary:#38BFA4; --primary-ink:#04211B; --accent:#F4C542; --accent-ink:#2A1E00;
  --mine:#173B33; --mine-ink:#BFF0E3; --now:#2E2810; --red:#FF6B5E; --red-bg:#3A1714; --brk:#1C2420; --danger:#F08A78; --danger-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[data-act]{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px 12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;flex:none;display:block;border-radius:10px;box-shadow:0 2px 8px rgba(124,58,237,.35)}
.tabs{display:flex;gap:3px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:640px){.tabs{order:3;width:100%}.tabs button{flex:1;padding:7px 2px;font-size:13px}}
.mechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600}
main{padding-block:16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line)}
.pill.ok{background:var(--mine);color:var(--mine-ink);border-color:transparent}
.pill.warn{background:var(--now);border-color:transparent}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
/* photos: initials underneath, the agent's photo from images/<Name>.jpg on top */
.av{--s:32px;position:relative;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;display:inline-block;vertical-align:middle;color:#fff}
.av b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.38);font-weight:700;letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* who are you */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 8px 12px;display:grid;justify-items:center;gap:8px;font-weight:700;font-size:16px;transition:transform .15s,border-color .15s}
.who button:hover{transform:translateY(-2px);border-color:var(--primary)}
/* home */
.hello{display:flex;align-items:center;gap:14px}
.hello .clock{margin-left:auto;text-align:right}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.clock small{font-size:14px;color:var(--muted)}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.rolecards{grid-template-columns:1fr}}
.rc{border-radius:20px;padding:18px 20px;display:grid;gap:6px;align-content:start;min-height:170px}
.rc h3{color:inherit;opacity:.85}
.rc .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,56px);line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.rc .when{font-family:var(--f-mono);font-size:clamp(16px,3.6vw,20px);font-weight:600}
.rc .cd{font-size:14px;opacity:.9}
.rc.cur{background:var(--red);color:#fff}
.rc.cur.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.rc.nxt{background:var(--now);color:var(--ink);border:1px solid transparent}
.rc.nxt.idle{background:var(--surface);border-color:var(--line)}
.myday{display:grid;gap:6px}
.myday .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.myday .it.cur{border:2px solid var(--red);background:var(--red-bg);color:var(--red)}
.myday .it.nx{border-color:var(--accent)}
.myday .it.past{opacity:.45}
/* roster */
.weekbar{display:flex;align-items:center;gap:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;display:grid;justify-items:center;min-width:0}
.days button span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.days button b{font-family:var(--f-mono);font-size:16px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.75}
.days button.istoday b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.days button.off{opacity:.5}
.arrow{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:32px;height:44px;font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600}
.chip.out{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.chip.out .av{filter:grayscale(1);opacity:.6}
.chip.out .nm{text-decoration:line-through}
.shifthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:8px}
/* the roster sheet always fits the screen width: no sideways scrolling */
.sheetwrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
table.sheet{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;overflow:hidden;font-size:clamp(8.5px,1.15vw,14px)}
.sheet thead th{font-size:clamp(8px,1vw,12px);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--sunk);font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.sheet col.tcol{width:clamp(36px,8%,96px)}
.sheet th.brkh,.sheet td.brk{background:var(--brk)}
.sheet tbody tr:last-child td{border-bottom:0}
.sheet td.time{font-family:var(--f-mono);font-size:clamp(8.5px,1.05vw,13px);border-right:1px solid var(--line);line-height:1.15}
.sheet .end{display:block;opacity:.6}
.cell{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;padding:3px 2px;width:100%;line-height:1.1;overflow-wrap:anywhere}
.cell .av{--s:clamp(18px,2.3vw,30px)}
@media (max-width:760px){.cell .av{display:none}}
.cell.me{background:var(--mine);color:var(--mine-ink);font-weight:700;box-shadow:inset 0 0 0 2px var(--primary)}
.cell.hl{background:var(--now);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
tr.cur td{background:var(--now)}
tr.cur td.time{color:var(--red);font-weight:700}
tr.past td{opacity:.5}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
/* managers, downloads, finished shifts */
.mechip .mgr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.who.mgrs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.who.mgrs button{padding:12px 6px 10px;font-size:15px;gap:4px}
.team{display:grid;gap:6px}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tm.brk{background:var(--brk)}
.tm b{display:block}.tm span.muted{display:block;font-size:12px}
.tm .role{font-family:var(--f-display);font-weight:800;font-size:19px;text-align:right}
.dlbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.donebar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
/* profile sheet, themes, admin, unsaved-changes bar */
.avbtn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.who button small.desc{display:block;font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.sheetback{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.55);display:grid;place-items:end center}
.sheet{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheetback{place-items:center}.sheet{border-radius:20px;padding:22px}}
.sheet h2{margin:0}.sheet p{margin:0}
.opt{display:grid;gap:8px}
.opt textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;resize:vertical;width:100%}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.th{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.th i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--c) 0 50%,var(--c2) 50% 100%);display:block}
.th[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.th span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){.themes{grid-template-columns:repeat(4,minmax(0,1fr))}}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
#savebar .sb{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#savebar .sb span{margin-right:auto;display:grid;min-width:0}#savebar small{opacity:.75;font-size:12px}
#savebar .btn.ghost{color:var(--bg);border-color:rgba(255,255,255,.35)}
body.hasbar main{padding-bottom:110px}
body.cardvis #savebar{display:none}
.savecard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
/* phone notifications */
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.shr{vertical-align:-3px}
.errline{margin:0;background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
/* spin + scratch */
.pickgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.pickgrid{grid-template-columns:1fr}}
.stage{display:grid;justify-items:center;gap:14px;position:relative}
.wheelwrap{position:relative;width:min(340px,100%);aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;display:block;will-change:transform;border-radius:50%}
.wheelwrap[data-act]{cursor:pointer}
.hub{position:absolute;left:50%;top:50%;width:18.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(13px,4.2vw,19px);color:var(--ink);pointer-events:none}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.result{border-radius:14px;padding:12px 14px;text-align:center;font-weight:600}
.result.good{background:var(--mine);color:var(--mine-ink)}
.result.again{background:var(--now)}
.result b{font-family:var(--f-display);font-size:22px;display:block}
.drawlist{display:grid;gap:6px}
.drawlist div{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--sunk)}
.drawlist .spot{margin-left:auto;font-family:var(--f-mono);font-size:13px}
.scard{position:relative;width:min(340px,100%);aspect-ratio:16/10;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.scard .under{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;padding:14px;background:repeating-linear-gradient(135deg,#FFF6DA 0 14px,#FFEFC0 14px 28px);color:#2A1E00}
.scard .under small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.7}
.scard .under b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.scard canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s}
.scard.gone canvas{opacity:0;pointer-events:none}
/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;background:var(--sunk);flex-wrap:wrap}
.li .grow{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li input[type="time"],.li input[type="text"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-width:0}
.field{display:grid;gap:6px}
.field select,.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;max-width:100%}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600}
.toggles button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;font-size:14px;padding:0}
/* alert banner + toast */
#banner{position:fixed;left:0;right:0;top:0;z-index:30;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-inline:16px;pointer-events:none}
#banner .b{max-width:560px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.3);pointer-events:auto;animation:drop .35s ease-out}
#banner .b big{font-family:var(--f-display);font-weight:800;font-size:24px;display:block;line-height:1.1}
#banner .b .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#banner .b{animation:none}.who button{transition:none}.scard canvas{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:4px}
.syncdot.off{background:var(--danger)}
footer{padding:0 0 24px;text-align:center;font-size:12px}
</style>
<script>/* the colour theme chosen on this device, applied before the page draws */try{var c=localStorage.getItem('dutyRoster.themeCss');if(c){var s=document.createElement('style');s.id='themevars';s.textContent=c;document.head.appendChild(s)}var m=localStorage.getItem('dutyRoster.mode');if(m==='light'||m==='dark')document.documentElement.dataset.theme=m}catch(e){}</script>
</head>
<body>

<header class="top"><div class="wrap">

/* ---------- who am I: remembered on this device ---------- */
// Saved three ways so it survives most browser clean-ups: local storage, a cookie, and ?me= in the address.
function getCookie(k){try{const c=document.cookie.split('; ').find(x=>x.startsWith(k+'='));return c?decodeURIComponent(c.slice(k.length+1))||null:null}catch(e){return null}}

let push = { id: LS.get('dutyRoster.pushId'), sub:null, busy:false, err:'', testAt:0, syncing:false };
const DEL = { __delete: true }; // "remove this field" marker for db.update
let rulesMarked = false;
// The new next-day rule and Saturday changes start the day after this version is first opened, so no running shift changes.
function markRulesStart(){ if (rulesMarked || demo || !cfg || cfg.rulesFrom || readOnly || !db) return; rulesMarked = true; setTimeout(() => { if (cfg && !cfg.rulesFrom) saveCfg({ rulesFrom: dkey(addDays(sod(new Date()),1)) }); }, 800); }

function localDb(){
  // Same shape as the Firebase helper, but kept in this browser only. Used until firebase-config.js is filled in.
  const P = 'waian.db:', subs = new Set();
  const read = p => { try { const v = localStorage.getItem(P+p); return v ? JSON.parse(v) : null; } catch(e) { return null; } };
  const write = (p,d) => { try { localStorage.setItem(P+p, JSON.stringify(d)); } catch(e) {} subs.forEach(f => f()); };
  const snap = p => { const d = read(p); return { id: p.split('/').pop(), exists: d != null, data: () => d }; };
  const list = c => { const out=[]; try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k && k.startsWith(P+c+'/')) out.push(snap(k.slice(P.length))); } } catch(e) {} return out; };
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith(P)) subs.forEach(f => f()); });
  const watch = f => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    doc: p => ({ get: async () => snap(p), set: async d => write(p,d), onSnapshot: n => watch(() => n(snap(p))) }),
    collection: c => ({ onSnapshot: n => watch(() => n({ docs: list(c) })) }),
    transact: async (p, fn) => { const out = fn(read(p) || {}); if (out.write) write(p, out.write); return out.result; },
    merge: async (p, d) => { const m = (a, b) => { for (const [k,v] of Object.entries(b)) a[k] = v && typeof v === 'object' && !Array.isArray(v) ? m(a[k] && typeof a[k] === 'object' ? a[k] : {}, v) : v; return a; }; write(p, m(read(p) || {}, d)); },
    update: async (p, patch) => { const d = read(p) || {}; for (const [k,v] of Object.entries(patch)) { const parts = k.split('.'); let o = d; for (let i = 0; i < parts.length-1; i++) o = o[parts[i]] = o[parts[i]] || {}; if (v === DEL) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = v; } write(p, d); },
  };
}

async function firebaseDb(fc){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, F, U] = await Promise.all([import(V+'firebase-app.js'), import(V+'firebase-firestore.js'), import(V+'firebase-auth.js')]);
  const app = A.initializeApp(fc);
  const fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const auth = U.getAuth(app);
  await new Promise((res, rej) => { const off = U.onAuthStateChanged(auth, u => { if (u) { off(); res(); } }); U.signInAnonymously(auth).catch(rej); });
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  return {
    doc: p => { const r = F.doc(fs, p); return { get: async () => wrap(await F.getDoc(r)), set: d => F.setDoc(r, d), onSnapshot: (n,e) => F.onSnapshot(r, { includeMetadataChanges: true }, s => n(wrap(s), !s.metadata.fromCache), e) }; },
    collection: p => { const r = F.collection(fs, p); return { onSnapshot: (n,e) => F.onSnapshot(r, { includeMetadataChanges: true }, s => n({ docs: s.docs.map(wrap) }, !s.metadata.fromCache), e) }; },
    transact: (p, fn) => { const r = F.doc(fs, p); return F.runTransaction(fs, async tx => { const s = await tx.get(r); const out = fn(s.exists() ? s.data() : {}); if (out.write) tx.set(r, out.write); return out.result; }); },
    merge: (p, d) => F.setDoc(F.doc(fs, p), d, { merge: true }),
    update: (p, patch) => F.updateDoc(F.doc(fs, p), Object.fromEntries(Object.entries(patch).map(([k,v]) => [k, v === DEL ? F.deleteField() : v]))),
  };
}

async function startDb(){
  // Always fetch the latest settings file (never an old cached copy).
  let fc = null; try { fc = (await import('./firebase-config.js?t='+Date.now())).firebaseConfig; } catch(e) {}
  try {
    if (!fc || !fc.apiKey || /PASTE/i.test(fc.apiKey)) { db = localDb(); demo = true; }
    else db = await firebaseDb(fc);
  } catch(e) {
    dbState = 'none';
    dbError = e && e.code === 'auth/operation-not-allowed' ? 'Turn on Anonymous sign-in in Firebase Authentication.'
      : e && e.code === 'auth/unauthorized-domain' ? 'Add this website address to Firebase Authentication → Settings → Authorized domains.'
      : (e && e.message) || 'Check your internet connection and reload.';
    return render(true);
  }
  const err = e => { dbState = 'none'; dbError = e && e.code === 'permission-denied' ? 'The database refused access. Check the Firestore rules and that Anonymous sign-in is turned on.' : (e && e.message) || ''; render(true); };
  // Snapshots also fire when only "saved on the server" changes; those just update fresh.* without redrawing.
  let cfgJ = null, absJ = null, whJ = null;
  db.doc('config/main').onSnapshot((s, srv) => { fresh.cfg = srv !== false; const d = s.exists ? s.data() : null, j = JSON.stringify(d);
    if (j !== cfgJ || dbState !== 'ready') { cfgJ = j; cfg = d; dbState = 'ready'; clearCache(); render(); markRulesStart(); } queuePlan(); }, err);
  db.collection('absences').onSnapshot((s, srv) => { fresh.abs = srv !== false; const a={}; s.docs.forEach(d => a[d.id] = d.data()); const j = JSON.stringify(a);
    if (j !== absJ) { absJ = j; absences = a; clearCache(); render(); } queuePlan(); }, err);
  db.collection('wheel').onSnapshot((s, srv) => { fresh.wheel = srv !== false; const w={}; s.docs.forEach(d => w[d.id] = d.data()); const j = JSON.stringify(w);
    if (j !== whJ) { whJ = j; wheels = w; clearCache(); render(); } queuePlan(); }, err);
  let profJ = null;
  db.collection('profiles').onSnapshot(s => { const p = {}; s.docs.forEach(d => p[d.id] = d.data()); const j = JSON.stringify(p);
    if (j !== profJ) { profJ = j; profiles = p; applyMyTheme(); render(); } }, () => {});
  // Phone notifications. Problems here never stop the roster from working.
  if (!demo) {
    db.doc('config/push').onSnapshot(s => { const was = pushReady(); pushCfg = s.exists ? s.data() : null; syncPush(); if (was !== pushReady()) render(); else refreshPushCard(); queuePlan(); }, () => {});
    db.doc('config/push-devices').onSnapshot(s => { pushDevices = (s.exists && s.data().devices) || {}; pushLoaded.dev = true; checkTestDone(); syncPush(); refreshPushCard(); queuePlan(); }, () => {});
    db.doc('config/push-meta').onSnapshot(s => { pushMeta = s.exists ? s.data() : {}; pushLoaded.meta = true; queuePlan(); }, () => {});
  }
}

function writeErr(e){
  if (e && e.code === 'permission-denied') { readOnly = true; toast('The database refused the change. Check the Firestore rules.'); }
  else if (e && e.code === 'resource-exhausted') toast('The free daily limit is used up. Changes will save again tomorrow.');
  else toast('Could not save. Check your connection and try again.');
}
let cfgChain = Promise.resolve();
function saveCfg(patch){
  if (!db) return toast('Still connecting to the team roster. Try again in a moment.');
  cfg = Object.assign({}, DEFAULTS, cfg || {}, patch); clearCache(); render(true);
  const body = JSON.parse(JSON.stringify(cfg));
  cfgChain = cfgChain.then(() => db.doc('config/main').set(body)).catch(writeErr);
}
let absChain = Promise.resolve();
function toggleAbsent(name){
  if (!db) return;
  const key = dkey(viewDate), cur = ((absences[key]||{}).names||[]).slice(), i = cur.indexOf(name);
  if (i >= 0) cur.splice(i,1); else cur.push(name);
  absences = { ...absences, [key]: { names: cur } }; clearCache(); render(true);
  toast(i >= 0 ? name+' is back on duty for '+fmtDay(viewDate)+'.' : name+' marked on leave for '+fmtDay(viewDate)+'. Roster adjusted.');
  absChain = absChain.then(() => db.doc('absences/'+key).set({ names: cur })).catch(writeErr);
}

/* ---------- photos ---------- */
// A photo set in someone's profile (tap your picture at the top) comes first, then images/<Name>.jpg, then initials.
const PAL = ['#6D28D9','#2F5DA8','#B5473A','#0E6B5C','#C08A1E','#2E6F8E','#7A4E6E','#4C7A2E','#A55B2A'];
function initials(n){ const p = String(n).trim().split(/\s+/); return ((p[0]||'?')[0] + (p[1] ? p[1][0] : (p[0]||'')[1] || '')).toUpperCase(); }
const photoUrls = new Map(); // name -> { src, url }: profile photos turned into short blob: links, so big tables stay light
function photoUrl(name){
  const p = profiles[pkey(name)], src = p && typeof p.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(p.photo) ? p.photo : '';
  const hit = photoUrls.get(name);
  if (hit && hit.src === src) return hit.url;
  if (hit && hit.url) URL.revokeObjectURL(hit.url);
  let url = '';
  if (src) { try { const [head, b64] = src.split(','), bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([u], { type: head.slice(5, head.indexOf(';')) })); } catch(e) { url = ''; } }
  photoUrls.set(name, { src, url }); return url;
}
function avatar(name, size=32){
  const own = photoUrl(name);
  return `<span class="av" style="--s:${size}px;background:${PAL[hash(name)%PAL.length]}" aria-hidden="true"><b>${esc(initials(name))}</b>${own ? `<img src="${own}" alt="">` : `<img src="images/${encodeURIComponent(name)}.jpg" alt="" loading="lazy" onerror="this.remove()">`}</span>`;
}
const profileOf = n => profiles[pkey(n)] || {};
const descOf = n => String(profileOf(n).desc || '').trim();

/* ---------- colour themes (each person picks their own; saved in their profile) ---------- */
// [primary, text on primary, my-name highlight, highlight text] for light mode, then the same for dark mode.
const THEMES = [
  { id:'purple',   name:'BC Purple', l:['#6D28D9','#FFFFFF','#EDE4FD','#3B137A'], d:['#A78BFA','#1A0B3D','#2A1D4A','#E4DAFE'] },
  { id:'teal',     name:'Teal',      l:['#0E6B5C','#FFFFFF','#D6F0E9','#0A4A3F'], d:['#38BFA4','#04211B','#173B33','#BFF0E3'] },
  { id:'blue',     name:'Ocean',     l:['#1D4ED8','#FFFFFF','#DCE7FD','#172C6E'], d:['#7AA2F7','#0A1633','#1B2A4A','#DCE7FD'] },
  { id:'cyan',     name:'Lagoon',    l:['#0E7490','#FFFFFF','#CFF4FC','#164E63'], d:['#22D3EE','#042B33','#12343D','#CDF5FC'] },
  { id:'green',    name:'Emerald',   l:['#047857','#FFFFFF','#D1FAE5','#064E3B'], d:['#34D399','#022C1E','#123828','#C9F7E2'] },
  { id:'gold',     name:'Gold', l:['#A16207','#FFFFFF','#FEF3C7','#713F12'], d:['#FACC15','#2A1F00','#3A3112','#FDF0B8'] },
  { id:'orange',   name:'Sunset',    l:['#C2410C','#FFFFFF','#FFE4D5','#7C2D12'], d:['#FB923C','#2B1205','#3D2416','#FFE1CC'] },
  { id:'red',      name:'Crimson',   l:['#B91C1C','#FFFFFF','#FDE2E2','#7F1D1D'], d:['#F87171','#330808','#3F1A1A','#FEDADA'] },
  { id:'rose',     name:'Rose',      l:['#BE185D','#FFFFFF','#FCE1EE','#831843'], d:['#F472B6','#33071A','#3E1A2C','#FDD7EA'] },
  { id:'graphite', name:'Graphite',  l:['#1F2937','#FFFFFF','#E5E7EB','#111827'], d:['#D1D5DB','#111827','#2A2F37','#E5E7EB'] },
];
const MODES = [['','Auto'],['light','Light'],['dark','Dark']];
const themeById = id => THEMES.find(t => t.id === id) || THEMES[0];
function themeCss(t){
  const v = a => `--primary:${a[0]};--primary-ink:${a[1]};--mine:${a[2]};--mine-ink:${a[3]}`;
  return `:root{${v(t.l)}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${v(t.d)}}}:root[data-theme="dark"]{${v(t.d)}}`;
}
function applyTheme(id, mode){
  let el = document.getElementById('themevars');
  if (!el) { el = document.createElement('style'); el.id = 'themevars'; document.head.appendChild(el); }
  el.textContent = themeCss(themeById(id));
  if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode; else delete document.documentElement.dataset.theme;
  LS.set('dutyRoster.themeCss', el.textContent); LS.set('dutyRoster.mode', mode || '');
}
// The theme of whoever is chosen on this device (unless their profile sheet is open with a preview).
function applyMyTheme(){ if (sheet && sheet.kind === 'profile') return; const p = me ? profileOf(me) : {}; applyTheme(p.theme || LS.get('dutyRoster.themeId') || 'purple', p.mode != null ? p.mode : (LS.get('dutyRoster.mode') || '')); }

/* ---------- admin (team settings) ---------- */
// A light lock so only the admin changes team settings: tap your profile picture 5 times and enter the password.
// It keeps casual changes out; it is not strong security (anyone with the site can still read the roster).
const ADMIN_HASH = 'bd20a36ae3667692e7859254045683339c9329e6830f88f807fbba2bcb8d6330';
let admin = LS.get('dutyRoster.admin') === '1';
const isAdmin = () => admin;
async function checkAdmin(pw){
  const norm = String(pw || '').toUpperCase().replace(/\s+/g, '');
  if (!(window.crypto && crypto.subtle)) return false;
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(norm)))].map(b => b.toString(16).padStart(2,'0')).join('');
  return h === ADMIN_HASH;
}
function setAdmin(on){ admin = !!on; LS.set('dutyRoster.admin', admin ? '1' : null); if (!admin && draft) { draft = null; clearCache(); renderSaveBar(); } }

/* ---------- unsaved team settings: changes wait here until the admin taps Save ---------- */
// (draft is declared with the other shared state near the top)
function stageCfg(patch){
  if (!isAdmin()) return toast('Only the admin can change team settings.');
  draft = Object.assign({}, draft || {}, patch); clearCache(); render(true); renderSaveBar();
}
function saveDraft(){ if (!draft) return; const p = draft; draft = null; saveCfg(p); renderSaveBar(); toast('Saved. The whole team sees the changes now.'); }
function discardDraft(){ draft = null; clearCache(); render(true); renderSaveBar(); toast('Changes discarded.'); }
function renderSaveBar(){
  const b = $('#savebar'); if (!b) return;
  document.documentElement.style.scrollPaddingBottom = draft ? '120px' : '';
  if (!draft) { b.hidden = true; b.innerHTML = ''; document.body.classList.remove('hasbar'); return; }
  b.hidden = false; document.body.classList.add('hasbar');
  b.innerHTML = `<div class="sb"><span><b>Unsaved team changes</b><small>Only you see them until you save.</small></span><button class="btn ghost sm" data-act="draft-discard">Discard</button><button class="btn primary" data-act="draft-save">Save changes</button></div>`;
}
window.addEventListener('beforeunload', e => { if (draft) { e.preventDefault(); e.returnValue = ''; } });
// The floating bar hides while the Save card at the bottom of Settings is on screen, so there is one Save button at a time.
let saveIO = null;
function watchSaveCard(){
  if (!('IntersectionObserver' in window)) return; if (saveIO) saveIO.disconnect();
  const card = document.querySelector('.savecard'); if (!card) { document.body.classList.remove('cardvis'); return; }
  saveIO = new IntersectionObserver(es => document.body.classList.toggle('cardvis', es.some(x => x.isIntersecting))); saveIO.observe(card);
}

/* ---------- profile sheet (tap your picture) and admin sheet (tap it 5 times) ---------- */
let taps = 0, tapT = null;
function meTap(){
  taps++; clearTimeout(tapT);
  if (taps >= 5) { taps = 0; openSheet('admin'); return; }
  tapT = setTimeout(() => { taps = 0; openSheet('profile'); }, 380);
}
function openSheet(kind){
  if (!signedIn()) return;
  if (kind === 'profile') { const p = profileOf(me); sheet = { kind, photo: p.photo || null, desc: p.desc || '', theme: p.theme || LS.get('dutyRoster.themeId') || 'purple', mode: p.mode != null ? p.mode : (LS.get('dutyRoster.mode') || ''), busy: false }; }
  else sheet = { kind, err: '', busy: false };
  renderSheet();
}
function closeSheet(){ sheet = null; renderSheet(); applyMyTheme(); }
function renderSheet(){
  const s = $('#sheet'); if (!s) return;
  if (!sheet) { s.hidden = true; s.innerHTML = ''; return; }
  s.hidden = false;
  let body;
  if (sheet.kind === 'admin') {
    body = isAdmin()
      ? `<h2>Admin</h2><p class="muted">Admin is on for this device. Team settings are in Settings.</p>
         <div class="row"><button class="btn primary" data-act="admin-go">Open team settings</button><button class="btn ghost danger" data-act="admin-lock">Lock admin</button><button class="btn ghost" data-act="sheet-cancel">Close</button></div>`
      : `<h2>Admin access</h2><p class="muted">Enter the admin password to manage team settings on this device.</p>
         <form class="addrow" data-form="admin"><input id="adminpw" type="password" autocomplete="current-password" placeholder="Admin password" aria-label="Admin password" autocapitalize="characters"><button class="btn primary" ${sheet.busy?'disabled':''}>Unlock</button></form>
         ${sheet.err ? `<p class="errline">${esc(sheet.err)}</p>` : ''}<div class="row"><button class="btn ghost" data-act="sheet-cancel">Cancel</button></div>`;
  } else {
    const t = sheet, mgr = isObs(), prev = t.photo && /^data:image\//.test(t.photo) ? t.photo : '';
    const big = `<span class="av" style="--s:92px;background:${PAL[hash(me)%PAL.length]}" aria-hidden="true"><b>${esc(initials(me))}</b>${prev ? `<img src="${prev}" alt="">` : `<img src="images/${encodeURIComponent(me)}.jpg" alt="" onerror="this.remove()">`}</span>`;
    body = `<div class="row" style="flex-wrap:nowrap">${big}<div style="min-width:0"><h2>${esc(me)}</h2><p class="muted">${mgr ? 'Manager · view only' : 'Agent'}${isAdmin() ? ' · Admin' : ''}</p></div></div>
      <div class="opt"><b>Photo</b><div class="row"><label class="btn" for="photoin">${prev ? 'Change photo' : 'Add a photo'}</label><input id="photoin" type="file" accept="image/*" hidden>${prev ? '<button class="btn ghost danger" data-act="photo-del">Remove photo</button>' : ''}</div></div>

    let cands = free.filter(i => !mine.has(i) && match(others, free.filter(j => j !== i), (p,j) => forb[p] && forb[p].has(j)));
    if (allowSame) cands = cands.concat(free.filter(i => sameMine.has(i)));
    if (!cands.length) cands = free.filter(i => !mine.has(i)); if (!cands.length) cands = free;

    <p class="muted" style="font-size:13px">Country code first, no + or spaces. Empty = ${WA_DEFAULT}. This is the number the WhatsApp bot is linked to.</p></section>

  <section class="card" style="display:grid;gap:12px"><h3>Weekly pick (Spin + Scratch)</h3>
    <label class="field"><b>Opens before the new week</b><select data-set="wheelHours">${[12,24,48].map(h => `<option value="${h}" ${+c.wheelHours===h?'selected':''}>${h} hours before Monday</option>`).join('')}</select></label>
    <p class="muted" style="font-size:13px">For the week of ${fmtDay(fromKey(w.next))}: ${w.open?'open now':'opens '+fmtDay(new Date(w.openAt))}. The button below works straight away.</p>
    <div class="row">${ov?`<button class="btn" data-act="wheel-close">Close it early</button>`:`<button class="btn" data-act="wheel-open">Open now for 24 hours</button>`}</div></section>
  ${about}
  </div>
  <section class="card savecard"><div><h3>Save changes</h3><p class="muted" style="font-size:13px">${draft ? 'You have unsaved team changes. Nobody else sees them until you save.' : 'Everything is saved.'}</p></div>
    <div class="row">${draft ? '<button class="btn ghost" data-act="draft-discard">Discard</button>' : ''}<button class="btn primary" data-act="draft-save" ${draft?'':'disabled'}>Save changes</button></div></section>`;
}
function onSettingChange(el){
  const c = C(), k = el.dataset.set, i = +el.dataset.i;
  if (k === 'role-brk') { const roles = rolesAll(); roles[i].brk = el.checked; stageCfg({ roles }); }
  else if (k === 'sat-on') { const sr = satRule(); stageCfg({ satRule: { ...sr, on: el.checked } }); }
  else if (k.startsWith('shift-')) { const shifts = c.shifts.map(s => ({...s})), f = {'shift-name':'name','shift-start':'start','shift-end':'end'}[k], v = el.value.trim(); if (!v) return render(true); shifts[i][f] = v; stageCfg({ shifts }); }
  else if (k === 'slotMode') stageCfg({ slotMode: el.value === 'auto' ? 'auto' : +el.value });
  else if (k === 'leadMin') stageCfg({ leadMin: +el.value });
  else if (k === 'wheelHours') stageCfg({ wheelHours: +el.value });
  else if (k === 'waNumber') stageCfg({ waNumber: el.value.replace(/\D/g,'') });
}
const setOrder = order => stageCfg({ staff: order, anchorWeek: wkKey(new Date()) });
function fmt24(m){ m = Math.min(m, 23*60+59); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

let wakeLock = null, wantWake = false;
async function getWake(){ try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; if (tab === 'settings') render(true); }); } catch(e) { wakeLock = null; toast("This device wouldn't keep the screen on. Change its auto-lock setting instead."); } if (tab === 'settings') render(true); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (wantWake && !wakeLock) getWake(); tickNow(); syncPush(); queuePlan(); } });
async function copyLink(){ const url = location.origin+location.pathname+'?me='+encodeURIComponent(me); try { await navigator.clipboard.writeText(url); toast('Your personal link is copied. Open it on another device to be remembered there too.'); } catch(e) { window.prompt('Copy your personal link:', url); } }

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, c = C();
  switch (a) {
    case 'tab': tab = el.dataset.tab; LS.set('dutyRoster.tab', tab); if (tab === 'roster') viewDate = sod(new Date()); scratch = { lock:false, res:null, busy:false, revealed:false }; render(true); window.scrollTo(0,0); break;
    case 'signin': me = el.dataset.name; rememberMe(me); setUrlMe(me); hl = null; unlockAudio(); applyMyTheme(); tab = 'home'; LS.set('dutyRoster.tab', tab); render(true); toast('Hi '+me+'! This device will remember you.');
      if (!staff().includes(me)) break;
      if (pushReady() && pushEnv() === 'ok' && Notification.permission !== 'denied') enablePush();
      else try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch(err) {} break;
    case 'signout': forgetDevice(); sheet = null; renderSheet(); me = null; rememberMe(null); setUrlMe(null); hl = null; tab = 'home'; applyMyTheme(); render(true); break;
    case 'seed': saveCfg({ staff: SEED_STAFF.slice(), anchorWeek: wkKey(new Date()), rulesFrom: '2000-01-01' }); toast('Team added. Everyone can now choose their name.'); break;
    case 'test-alert': unlockAudio(); setTimeout(() => { const s = Math.ceil((new Date().getHours()*60+new Date().getMinutes()+3)/5)*5; fireAlert({ role:'Greeter', brk:false, at:s, end:s+30, from:'SAS1', hideAt:Date.now()+20000 }); }, 120); break;
    case 'notif': try { Notification.requestPermission().then(() => render(true)).catch(() => {}); } catch(err) {} break;
    case 'wake': if (wakeLock) { wantWake = false; wakeLock.release(); wakeLock = null; render(true); } else { wantWake = true; getWake(); } break;
    case 'copy-link': copyLink(); break;
    case 'banner-close': bannerData = null; clearInterval(alarmT); renderBanner(); break;
    case 'day': viewDate = fromKey(el.dataset.key); render(true); break;
    case 'wk': viewDate = addDays(viewDate, 7 * +el.dataset.dir); render(true); break;
    case 'absent': if (readOnly || isObs()) return toast('View only.'); toggleAbsent(el.dataset.name); break;
    case 'hl': hl = el.dataset.name && el.dataset.name !== hl ? el.dataset.name : null; render(true); break;
    case 'spin': doSpin(); break;
    case 'past': showPast = !showPast; render(true); break;
    case 'dl-pdf': downloadPdf(el.dataset.week ? fromKey(el.dataset.week) : viewDate); break;
    case 'dl-csv': downloadCsv(el.dataset.week ? fromKey(el.dataset.week) : viewDate); break;
    case 'dl-share': sharePdf(); break;
    case 'obs-del': { const n = el.dataset.name; if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '?'; toast('Tap ✕ again to remove '+n+'.'); return; } stageCfg({ observers: observers().filter(x => x !== n) }); break; }
    case 'push-on': enablePush(); break;
    case 'push-off': disablePush(); break;
    case 'push-test': testPush(); break;
    case 'scratch-new': scratch = { lock:false, res:null, busy:false, revealed:false }; render(true); break;
    case 'staff-move': { const o = weekOrder(wkKey(new Date())).slice(), i = +el.dataset.i, j = i + +el.dataset.d; [o[i],o[j]] = [o[j],o[i]]; setOrder(o); break; }
    case 'staff-del': { const o = weekOrder(wkKey(new Date())).slice(), i = +el.dataset.i; if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '?'; el.setAttribute('aria-label','Tap again to remove'); toast('Tap ✕ again to remove '+o[i]+'.'); return; } o.splice(i,1); setOrder(o); break; }
    case 'role-move': { const r = rolesAll(), i = +el.dataset.i, j = i + +el.dataset.d; [r[i],r[j]] = [r[j],r[i]]; stageCfg({ roles: r }); break; }
    case 'role-del': { const r = rolesAll(); if (r.length <= 1) return; r.splice(+el.dataset.i,1); stageCfg({ roles: r }); break; }
    case 'sat-staff': { const sr = satRule(), n = el.dataset.name, s = sr.staff.includes(n) ? sr.staff.filter(x => x !== n) : [...sr.staff, n]; stageCfg({ satRule: { ...sr, staff: s } }); break; }
    case 'sat-role': { const sr = satRule(), n = el.dataset.name, has = sr.roles.some(x => normName(x) === normName(n)), r = has ? sr.roles.filter(x => normName(x) !== normName(n)) : [...sr.roles, n]; stageCfg({ satRule: { ...sr, roles: r } }); break; }
    case 'shift-add': { const s = c.shifts.slice(), last = s[s.length-1]; s.push({ name:'Shift '+(s.length+1), start: last ? last.end : '08:00', end: last ? fmt24(parseHM(last.end)+270) : '12:30' }); stageCfg({ shifts: s }); break; }
    case 'shift-del': { if (c.shifts.length <= 1) return; const s = c.shifts.slice(); s.splice(+el.dataset.i,1); stageCfg({ shifts: s }); break; }
    case 'wday': { const d = +el.dataset.d; let w = c.workDays.slice(); w = w.includes(d) ? w.filter(x => x !== d) : [...w,d]; if (!w.length) return; stageCfg({ workDays: w, anchorWeek: wkKey(new Date()), staff: weekOrder(wkKey(new Date())) }); break; }
    case 'wheel-open': { if (!isAdmin()) return toast('Only the admin can do this.'); const w = pickWindow(); saveCfg({ wheelOverride: { wk: w.next, until: Date.now()+24*3600000 } }); toast('Spin and Scratch are open for 24 hours.'); break; }
    case 'wheel-close': if (!isAdmin()) return toast('Only the admin can do this.'); saveCfg({ wheelOverride: null }); break;
    case 'me-tap': meTap(); break;
    case 'profile-open': openSheet('profile'); break;
    case 'sheet-close': if (e.target.closest('[data-stop]')) return; closeSheet(); break;
    case 'sheet-cancel': closeSheet(); break;
    case 'theme': if (sheet) { sheet.theme = el.dataset.id; applyTheme(sheet.theme, sheet.mode); renderSheet(); } break;
    case 'mode': if (sheet) { sheet.mode = el.dataset.v; applyTheme(sheet.theme, sheet.mode); renderSheet(); } break;
    case 'photo-del': if (sheet) { sheet.photo = null; renderSheet(); } break;
    case 'profile-save': saveProfileSheet(); break;
    case 'admin-go': sheet = null; renderSheet(); tab = 'settings'; LS.set('dutyRoster.tab', tab); render(true); window.scrollTo(0,0); break;
    case 'admin-lock': setAdmin(false); sheet = null; renderSheet(); render(true); toast('Admin is locked on this device.'); break;
    case 'draft-save': saveDraft(); break;
    case 'draft-discard': discardDraft(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'photoin') { const f = e.target.files && e.target.files[0]; if (!f || !sheet) return;
    readPhoto(f).then(url => { if (sheet) { sheet.photo = url; renderSheet(); } }).catch(() => toast('That file could not be read as a photo. Try a JPG or PNG.')); return; }
  if (e.target.dataset && e.target.dataset.set) onSettingChange(e.target);
});
document.addEventListener('input', e => { if (e.target.id === 'descin' && sheet) { sheet.desc = e.target.value; const n = document.querySelector('[data-desclen]'); if (n) n.textContent = e.target.value.length; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'staff') { const v = $('#newstaff').value.trim(); if (!v) return; if (staff().includes(v)) return toast(v+' is already on the team.'); setOrder([...(staff().length ? weekOrder(wkKey(new Date())) : []), v]); }
  if (f === 'admin') { const pw = ($('#adminpw') || {}).value; if (!sheet) return; sheet.busy = true; sheet.err = ''; renderSheet();
    checkAdmin(pw).then(ok => { if (!sheet) return; sheet.busy = false;
      if (ok) { setAdmin(true); sheet = null; renderSheet(); tab = 'settings'; LS.set('dutyRoster.tab', tab); render(true); window.scrollTo(0,0); toast('Admin unlocked on this device.'); }
      else { sheet.err = 'Wrong password. Try again.'; renderSheet(); } }); return; }
  if (f === 'observer' && !e.target.dataset.signin) { const inp = e.target.querySelector('input'), v = String((inp && inp.value) || '').trim(); if (!v) return;
    if (staff().includes(v)) return toast(v+' is on the team already. Managers are people who are not on the roster.');
    if (!observers().includes(v)) stageCfg({ observers: [...observers(), v] }); return; }
  if (f === 'observer') { const inp = e.target.querySelector('input'), n = addObserver(inp && inp.value); if (!n) return;
    if (e.target.dataset.signin) { me = n; rememberMe(me); setUrlMe(me); hl = null; tab = 'home'; LS.set('dutyRoster.tab', tab); render(true); toast('Hi '+me+'! You can see the team roster here.'); } else toast(n+' added as a manager.'); }
  if (f === 'role') { const v = $('#newrole').value.trim(); if (!v) return; if (isStandby({ name: v })) return toast('Standby is not used. Add a working role instead.'); const r = rolesAll(), bi = r.findIndex(x => x.brk); r.splice(bi < 0 ? r.length : bi, 0, { name: v }); stageCfg({ roles: r }); }
});

/* ---------- live clock ---------- */
function updateLive(){
  document.querySelectorAll('[data-clock]').forEach(el => el.innerHTML = clockText(new Date()));
  const now = Date.now(); document.querySelectorAll('[data-cd]').forEach(el => el.textContent = fmtCd(+el.dataset.cd - now));
  const a = document.querySelector('[data-audio]'); if (a) { const ok = audioReady(); a.className = 'pill '+(ok?'ok':'warn'); a.textContent = ok ? 'Alert sound on · '+(+C().leadMin||3)+' min before each change' : 'Tap anywhere to turn on the alert sound'; }
}
let lastSig = '';
function tickNow(){
  const now = new Date(); if (dbState === 'ready') checkAlerts(now);
  if (bannerData && now.getTime() > bannerData.hideAt) { bannerData = null; clearInterval(alarmT); renderBanner(); }
  const t = nowMin(now); let sig = dkey(now)+'|';
  if (cfg && staff().length) { const sl = allSlots(dayRoster(sod(now))); sig += sl.filter(s => s.start <= t).length+'|'+sl.filter(s => s.end <= t).length; }
  if (cfg) sig += '|'+pickWindow().open;
  if (sig !== lastSig) { const first = !lastSig; if (lastSig && lastSig.slice(0,10) !== sig.slice(0,10)) showPast = false; lastSig = sig; if (!first && tab !== 'settings' && !spin.anim && !scratch.lock) render(); }
  updateLive();
}
setInterval(tickNow, 1000);
setInterval(renderHeader, 15000);
window.addEventListener('online', () => { renderHeader(); updateLive(); });
window.addEventListener('offline', () => { renderHeader(); if (!demo) toast('You are offline. Changes will save when the connection is back.'); });
applyMyTheme();
render(true);
startDb();
</script>
</body>
