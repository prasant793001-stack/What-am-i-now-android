<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Ain BC</title>
<meta name="theme-color" content="#0B0B10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">

<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#14201D; --muted:#5B6A66; --line:#D9E1DF;
  --primary:#0E6B5C; --primary-ink:#FFFFFF; --accent:#F0B429; --accent-ink:#2A1E00;
  --mine:#D6F0E9; --mine-ink:#0A4A3F; --now:#FFF4D6; --red:#D93025; --red-bg:#FDE7E5; --brk:#F2EEE4; --danger:#B3402F; --danger-bg:#FBE5E1;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 8px 24px rgba(20,32,29,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#15201D; --sunk:#111A18; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --primary:#38BFA4; --primary-ink:#04211B; --accent:#F4C542; --accent-ink:#2A1E00;
  --mine:#173B33; --mine-ink:#BFF0E3; --now:#2E2810; --red:#FF6B5E; --red-bg:#3A1714; --brk:#1C2420; --danger:#F08A78; --danger-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#15201D; --sunk:#111A18; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --primary:#38BFA4; --primary-ink:#04211B; --accent:#F4C542; --accent-ink:#2A1E00;
  --mine:#173B33; --mine-ink:#BFF0E3; --now:#2E2810; --red:#FF6B5E; --red-bg:#3A1714; --brk:#1C2420; --danger:#F08A78; --danger-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[data-act]{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px 12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;flex:none;display:block;border-radius:10px;box-shadow:0 2px 8px rgba(124,58,237,.35)}
.tabs{display:flex;gap:3px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;line-height:1.15}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:640px){.tabs{order:3;width:100%}.tabs button{flex:1;padding:7px 2px;font-size:13px;white-space:normal}}
.mechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600}
#mebox{display:flex;align-items:center;gap:8px}
.wdot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 0 2px var(--surface)}
.wdot.ok{background:#16A34A;box-shadow:0 0 0 2px var(--surface),0 0 8px rgba(22,163,74,.8)}
.wdot.bad{background:#DC2626;box-shadow:0 0 0 2px var(--surface),0 0 8px rgba(220,38,38,.7)}
.adminchip{border:1px solid #7C3AED;background:#7C3AED1A;color:#7C3AED;border-radius:999px;padding:5px 10px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
main{padding-block:16px 96px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line)}
.pill.ok{background:var(--mine);color:var(--mine-ink);border-color:transparent}
.pill.warn{background:var(--now);border-color:transparent}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
/* photos: initials underneath, the agent's photo from images/<Name>.jpg on top */
.av{--s:32px;position:relative;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;display:inline-block;vertical-align:middle;color:#fff}
.av b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.38);font-weight:700;letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* who are you */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 8px 12px;display:grid;justify-items:center;gap:8px;font-weight:700;font-size:16px;transition:transform .15s,border-color .15s}
.who button:hover{transform:translateY(-2px);border-color:var(--primary)}
/* home */
.hello{display:flex;align-items:center;gap:14px}
.hello .clock{margin-left:auto;text-align:right}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.clock small{font-size:14px;color:var(--muted)}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.rolecards{grid-template-columns:1fr}}
.rc{border-radius:20px;padding:18px 20px;display:grid;gap:6px;align-content:start;min-height:170px}
.rc h3{color:inherit;opacity:.85}
.rc .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,56px);line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.rc .when{font-family:var(--f-mono);font-size:clamp(16px,3.6vw,20px);font-weight:600}
.rc .cd{font-size:14px;opacity:.9}
.rc.cur{background:var(--red);color:#fff}
.rc.cur.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.rc.nxt{background:var(--now);color:var(--ink);border:1px solid transparent}
.rc.nxt.idle{background:var(--surface);border-color:var(--line)}
.myday{display:grid;gap:6px}
.myday .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.myday .it.cur{border:2px solid var(--red);background:var(--red-bg);color:var(--red)}
.myday .it.nx{border-color:var(--accent)}
.myday .it.past{opacity:.45}
/* roster */
.weekbar{display:flex;align-items:center;gap:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;display:grid;justify-items:center;min-width:0}
.days button span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.days button b{font-family:var(--f-mono);font-size:16px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.75}
.days button.istoday b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.days button.off{opacity:.5}
.arrow{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:32px;height:44px;font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600}
.chip.out{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.chip.out .av{filter:grayscale(1);opacity:.6}
.chip.out .nm{text-decoration:line-through}
.shifthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:8px}
/* the roster sheet always fits the screen width: no sideways scrolling */
.sheetwrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
table.sheet{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;overflow:hidden;font-size:clamp(8.5px,1.15vw,14px)}
.sheet thead th{font-size:clamp(8px,1vw,12px);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--sunk);font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.sheet col.tcol{width:clamp(36px,8%,96px)}
.sheet th.brkh,.sheet td.brk{background:var(--brk)}
.sheet tbody tr:last-child td{border-bottom:0}
.sheet td.time{font-family:var(--f-mono);font-size:clamp(8.5px,1.05vw,13px);border-right:1px solid var(--line);line-height:1.15}
.sheet .end{display:block;opacity:.6}
.cell{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;padding:3px 2px;width:100%;line-height:1.1;overflow-wrap:anywhere}
.cell .av{--s:clamp(18px,2.3vw,30px)}
@media (max-width:760px){.cell .av{display:none}}
.cell.me{background:var(--mine);color:var(--mine-ink);font-weight:700;box-shadow:inset 0 0 0 2px var(--primary)}
.cell.hl{background:var(--now);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
tr.cur td{background:var(--now)}
tr.cur td.time{color:var(--red);font-weight:700}
tr.past td{opacity:.5}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
/* managers, downloads, finished shifts */
.mechip .mgr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.who.mgrs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.who.mgrs button{padding:12px 6px 10px;font-size:15px;gap:4px}
.team{display:grid;gap:6px}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tm.brk{background:var(--brk)}
.tm b{display:block}.tm span.muted{display:block;font-size:12px}
.tm .role{font-family:var(--f-display);font-weight:800;font-size:19px;text-align:right}
.dlbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.donebar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
/* profile sheet, themes, admin, unsaved-changes bar */
.avbtn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.who button small.desc{display:block;font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.pback{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.55);display:grid;place-items:end center}
.panel{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;box-shadow:var(--shadow)}
@media (min-width:700px){.pback{place-items:center}.panel{border-radius:20px;padding:22px}}
.panel h2{margin:0}.panel p{margin:0}
.opt{display:grid;gap:8px}
.opt textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;resize:vertical;width:100%}
.opt input[type=text],.opt input:not([type]){border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;width:100%;min-height:44px}
.opt input:not([type]):focus,.opt textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.th{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.th i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--c) 0 50%,var(--c2) 50% 100%);display:block}
.th[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.th span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){.themes{grid-template-columns:repeat(4,minmax(0,1fr))}}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
#savebar .sb{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#savebar .sb span{margin-right:auto;display:grid;min-width:0}#savebar small{opacity:.75;font-size:12px}
#savebar .btn.ghost{color:var(--bg);border-color:rgba(255,255,255,.35)}
body.hasbar main{padding-bottom:110px}
body.cardvis #savebar{display:none}
.savecard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
/* home: who is on the front roles now */
.onnow{display:grid;gap:12px}
.rbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.rbs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rb{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"lbl lbl" "av who" "meta meta";gap:6px 10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);min-width:0}
.rb>small{grid-area:lbl;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;line-height:1.2}
.rb>.av{grid-area:av}
.rb>b.who{grid-area:who;min-width:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.rb>.meta{grid-area:meta;font-size:12px;line-height:1.3}.rb>.meta b{font-weight:700;color:var(--ink)}
.rb.mine{background:var(--mine);color:var(--mine-ink);border-color:var(--primary)}.rb.mine>small,.rb.mine>.meta,.rb.mine>.meta b{color:inherit}
.rb.off{opacity:.6}
@media (max-width:380px){.rb{padding:10px;gap:5px 8px}.rb>.av{--s:34px!important}.rb>b.who{font-size:16px}}
/* settings: admin photo buttons */
.avpick{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none;line-height:0}
.avpick i{position:absolute;right:-4px;bottom:-4px;font-size:11px;font-style:normal;line-height:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
/* profile panel: styles */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stl{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left;min-width:0;color:var(--ink)}
.stl i{width:38px;height:38px;border-radius:10px;flex:none;background:radial-gradient(circle at 70% 30%,var(--c) 0 22%,transparent 23%),linear-gradient(135deg,var(--b) 0 46%,var(--a) 46%);border:1px solid rgba(127,127,127,.35)}
.stl span{display:grid;min-width:0}.stl b{font-size:14px}.stl small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stl[aria-pressed="true"]{border-color:var(--ink)}
.btn.wa.sm{padding:5px 12px;font-size:13px}
/* phone notifications */
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.shr{vertical-align:-3px}
.errline{margin:0;background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
/* spin + scratch */
.pickgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.pickgrid{grid-template-columns:1fr}}
.stage{display:grid;justify-items:center;gap:14px;position:relative}
.wheelwrap{position:relative;width:min(340px,100%);aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;display:block;will-change:transform;border-radius:50%}
.wheelwrap[data-act]{cursor:pointer}
.hub{position:absolute;left:50%;top:50%;width:18.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(13px,4.2vw,19px);color:var(--ink);pointer-events:none}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.result{border-radius:14px;padding:12px 14px;text-align:center;font-weight:600}
.result.good{background:var(--mine);color:var(--mine-ink)}
.result.again{background:var(--now)}
.result b{font-family:var(--f-display);font-size:22px;display:block}
.drawlist{display:grid;gap:6px}
.drawlist div{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--sunk)}
.drawlist .spot{margin-left:auto;font-family:var(--f-mono);font-size:13px}
.scard{position:relative;width:min(340px,100%);aspect-ratio:16/10;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.scard .under{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;padding:14px;background:repeating-linear-gradient(135deg,#FFF6DA 0 14px,#FFEFC0 14px 28px);color:#2A1E00}
.scard .under small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.7}
.scard .under b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}

<script type="module">
import { DAYN, MON, DEFAULTS, sod, addDays, dkey, fromKey, monday, wkKey, parseHM, fmtT, fmtRange, fmtDay, fmtCd, hash, rotate, pkey, C, staff, setData, cleanAssign, match, buildPositions, dayRoster, allSlots, roleOf, myItems,

const VERSION = '1.7.1';   // update number: open copies compare it with version.json

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const SS = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const nowMin = d => d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;

/* ---------- who am I: remembered on this device ---------- */
// Saved three ways so it survives most browser clean-ups: local storage, a cookie, and ?me= in the address.
function getCookie(k){try{const c=document.cookie.split('; ').find(x=>x.startsWith(k+'='));return c?decodeURIComponent(c.slice(k.length+1))||null:null}catch(e){return null}}
function rememberMe(n){LS.set('dutyRoster.me',n);try{document.cookie='dutyRoster.me='+(n?encodeURIComponent(n):'')+';path=/;max-age='+(n?34560000:0)+';SameSite=Lax'}catch(e){}}
function setUrlMe(n){try{const u=new URL(location.href);n?u.searchParams.set('me',n):u.searchParams.delete('me');history.replaceState(null,'',u)}catch(e){}}
let me = new URLSearchParams(location.search).get('me') || LS.get('dutyRoster.me') || getCookie('dutyRoster.me');
if (me) { rememberMe(me); setUrlMe(me); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}

let tab = LS.get('dutyRoster.tab') || 'home';
if (tab === 'spin' || tab === 'scratch') tab = 'luck';
if (!['home','roster','luck','settings'].includes(tab)) tab = 'home';
let viewDate = sod(new Date()), hl = null;

/* ---------- shared data (Firebase), or this device only (demo mode) ---------- */
let db = null, dbState = 'loading', dbError = '', demo = false, readOnly = false;
let cfg = null, absences = {}, wheels = {}, profiles = {};
let draft = null, sheet = null; // draft = the admin's unsaved team settings; sheet = the open profile/admin panel
const liveCfg = () => draft ? Object.assign({}, cfg || {}, draft) : cfg;
function clearCache(){ setData(liveCfg(), absences, wheels); }
// fresh.* = that data has been confirmed by the server, not just an offline copy (the push plan is only written from fresh data).
let fresh = { cfg:false, abs:false, wheel:false }, pushCfg = null, pushDevices = {}, pushMeta = {}, pushLoaded = { dev:false, meta:false };
let push = { id: LS.get('dutyRoster.pushId'), sub:null, busy:false, err:'', testAt:0, syncing:false };
const DEL = { __delete: true }; // "remove this field" marker for db.update
let rulesMarked = false;
// The new next-day rule and Saturday changes start the day after this version is first opened, so no running shift changes.
function markRulesStart(){ if (rulesMarked || demo || !cfg || cfg.rulesFrom || readOnly || !db) return; rulesMarked = true; setTimeout(() => { if (cfg && !cfg.rulesFrom) saveCfg({ rulesFrom: dkey(addDays(sod(new Date()),1)) }); }, 800); }

function localDb(){
  // Same shape as the Firebase helper, but kept in this browser only. Used until firebase-config.js is filled in.
  const P = 'waian.db:', subs = new Set();
  const read = p => { try { const v = localStorage.getItem(P+p); return v ? JSON.parse(v) : null; } catch(e) { return null; } };
  const write = (p,d) => { try { localStorage.setItem(P+p, JSON.stringify(d)); } catch(e) {} subs.forEach(f => f()); };
  const snap = p => { const d = read(p); return { id: p.split('/').pop(), exists: d != null, data: () => d }; };
  const list = c => { const out=[]; try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k && k.startsWith(P+c+'/')) out.push(snap(k.slice(P.length))); } } catch(e) {} return out; };
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith(P)) subs.forEach(f => f()); });
  const watch = f => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    doc: p => ({ get: async () => snap(p), set: async d => write(p,d), onSnapshot: n => watch(() => n(snap(p))) }),
    collection: c => ({ onSnapshot: n => watch(() => n({ docs: list(c) })) }),
    transact: async (p, fn) => { const out = fn(read(p) || {}); if (out.write) write(p, out.write); return out.result; },
    merge: async (p, d) => { const m = (a, b) => { for (const [k,v] of Object.entries(b)) a[k] = v && typeof v === 'object' && !Array.isArray(v) ? m(a[k] && typeof a[k] === 'object' ? a[k] : {}, v) : v; return a; }; write(p, m(read(p) || {}, d)); },
    update: async (p, patch) => { const d = read(p) || {}; for (const [k,v] of Object.entries(patch)) { const parts = k.split('.'); let o = d; for (let i = 0; i < parts.length-1; i++) o = o[parts[i]] = o[parts[i]] || {}; if (v === DEL) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = v; } write(p, d); },
    del: async p => { try { localStorage.removeItem(P+p); } catch(e) {} subs.forEach(f => f()); },
  };
}

async function firebaseDb(fc){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, F, U] = await Promise.all([import(V+'firebase-app.js'), import(V+'firebase-firestore.js'), import(V+'firebase-auth.js')]);
  const app = A.initializeApp(fc);
  const fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const auth = U.getAuth(app);
  await new Promise((res, rej) => { const off = U.onAuthStateChanged(auth, u => { if (u) { off(); res(); } }); U.signInAnonymously(auth).catch(rej); });
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  return {
    doc: p => { const r = F.doc(fs, p); return { get: async () => wrap(await F.getDoc(r)), set: d => F.setDoc(r, d), onSnapshot: (n,e) => F.onSnapshot(r, { includeMetadataChanges: true }, s => n(wrap(s), !s.metadata.fromCache), e) }; },
    collection: p => { const r = F.collection(fs, p); return { onSnapshot: (n,e) => F.onSnapshot(r, { includeMetadataChanges: true }, s => n({ docs: s.docs.map(wrap) }, !s.metadata.fromCache), e) }; },
    transact: (p, fn) => { const r = F.doc(fs, p); return F.runTransaction(fs, async tx => { const s = await tx.get(r); const out = fn(s.exists() ? s.data() : {}); if (out.write) tx.set(r, out.write); return out.result; }); },
    merge: (p, d) => F.setDoc(F.doc(fs, p), d, { merge: true }),
    update: (p, patch) => F.updateDoc(F.doc(fs, p), Object.fromEntries(Object.entries(patch).map(([k,v]) => [k, v === DEL ? F.deleteField() : v]))),
    del: p => F.deleteDoc(F.doc(fs, p)),
  };
}

async function startDb(){
  // Always fetch the latest settings file (never an old cached copy).
  let fc = null; try { fc = (await import('./firebase-config.js?t='+Date.now())).firebaseConfig; } catch(e) {}
  try {
    if (!fc || !fc.apiKey || /PASTE/i.test(fc.apiKey)) { db = localDb(); demo = true; }
    else db = await firebaseDb(fc);
  } catch(e) {
    dbState = 'none';
    dbError = e && e.code === 'auth/operation-not-allowed' ? 'Turn on Anonymous sign-in in Firebase Authentication.'
      : e && e.code === 'auth/unauthorized-domain' ? 'Add this website address to Firebase Authentication → Settings → Authorized domains.'
      : (e && e.message) || 'Check your internet connection and reload.';
    return render(true);
  }
  const err = e => { dbState = 'none'; dbError = e && e.code === 'permission-denied' ? 'The database refused access. Check the Firestore rules and that Anonymous sign-in is turned on.' : (e && e.message) || ''; render(true); };
  // Snapshots also fire when only "saved on the server" changes; those just update fresh.* without redrawing.
  let cfgJ = null, absJ = null, whJ = null;
  db.doc('config/main').onSnapshot((s, srv) => { fresh.cfg = srv !== false; const d = s.exists ? s.data() : null, j = JSON.stringify(d);
    if (j !== cfgJ || dbState !== 'ready' || !cfgJ) { cfgJ = j; cfg = d; dbState = 'ready'; clearCache(); followRename(); render(); markRulesStart(); saveSnap(); } queuePlan(); queueLock(); }, err);
  db.collection('absences').onSnapshot((s, srv) => { fresh.abs = srv !== false; const a={}; s.docs.forEach(d => a[d.id] = d.data()); const j = JSON.stringify(a);
    if (j !== absJ) { absJ = j; absences = a; clearCache(); render(); saveSnap(); } queuePlan(); queueLock(); }, err);
  db.collection('wheel').onSnapshot((s, srv) => { fresh.wheel = srv !== false; const w={}; s.docs.forEach(d => w[d.id] = d.data()); const j = JSON.stringify(w);
    if (j !== whJ) { whJ = j; wheels = w; clearCache(); render(); saveSnap(); } queuePlan(); queueLock(); }, err);
  db.doc('config/qr-index').onSnapshot(s => { qrIndex = (s.exists && s.data() && s.data().has) || {}; saveSnap(); if (sheet && sheet.kind === 'tools') renderSheet(); if (tab === 'settings' && isAdmin()) render(); }, () => {});
  let profJ = null;
  db.collection('profiles').onSnapshot(s => { const p = {}; s.docs.forEach(d => p[d.id] = d.data()); const j = JSON.stringify(p);
    profilesLoaded = true; if (j !== profJ) { profJ = j; profiles = p; applyMyTheme(); render(); saveSnap(); if (sheet && /^(tools|weekly|zero)$/.test(sheet.kind)) renderSheet(); } }, () => { profilesLoaded = true; });
  // Phone notifications. Problems here never stop the roster from working.
  if (!demo) {
    db.doc('config/push').onSnapshot(s => { const was = pushReady(); pushCfg = s.exists ? s.data() : null; syncPush(); if (was !== pushReady()) render(); else refreshPushCard(); queuePlan(); }, () => {});
    db.doc('config/push-devices').onSnapshot(s => { pushDevices = (s.exists && s.data().devices) || {}; pushLoaded.dev = true; checkTestDone(); syncPush(); refreshPushCard(); queuePlan(); }, () => {});
    db.doc('config/push-meta').onSnapshot(s => { pushMeta = s.exists ? s.data() : {}; pushLoaded.meta = true; queuePlan(); }, () => {});
  }
}

/* ---------- instant start: the last roster this device saw shows at once while the database connects ---------- */
const SNAP_KEY = 'dutyRoster.snap';
let snapT = null;
function saveSnap(){
  clearTimeout(snapT);
  snapT = setTimeout(() => { if (demo || !cfg) return; try {
    const d0 = dkey(addDays(sod(new Date()), -8)), w0 = dkey(addDays(monday(new Date()), -7));
    const snap = { v: 1, at: Date.now(), cfg, absences: Object.fromEntries(Object.entries(absences).filter(([k]) => k >= d0)), wheels: Object.fromEntries(Object.entries(wheels).filter(([k]) => k >= w0)), profiles, qr: qrIndex };
    let j = JSON.stringify(snap);
    if (j.length > 2500000) { snap.profiles = Object.fromEntries(Object.entries(profiles).map(([k,v]) => [k, { ...v, photo: null }])); j = JSON.stringify(snap); }
    localStorage.setItem(SNAP_KEY, j);
  } catch(e) {} }, 1500);
}
function loadSnap(){
  try {
    const sn = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if (!sn || !sn.cfg || Date.now() - sn.at > 30*86400000) return;
    cfg = sn.cfg; absences = sn.absences || {}; wheels = sn.wheels || {}; profiles = sn.profiles || {}; qrIndex = sn.qr || {};
    profilesLoaded = true; dbState = 'ready'; clearCache();
  } catch(e) {}

function writeErr(e){

const GH_DEFAULT = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0]; return m && seg ? m[1]+'/'+seg : 'prasant793001-stack/What-am-i-now-android'; })();
let gh = { busy:'', msg:'', err:'', url:'' };
const ghRepo = () => (LS.get('dutyRoster.ghRepo') || GH_DEFAULT).trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/\/+$/,'');
const ghToken = () => (LS.get('dutyRoster.ghToken') || '').trim();
function ghErr(status, j){

  if (status === 403) return 'The token is not allowed to change this repository. It needs "Contents: Read and write".';
  if (status === 404) return 'Repository not found. Check the name, and that the token was made for this repository.';
  if (status === 409 || status === 422) return 'GitHub changed while pushing. Tap Push again.';
  return 'GitHub error '+status+((j && j.message) ? ': '+j.message : '');
}
async function ghApi(path, opts={}){

function ghFiles(){
  const files = [];

async function pushToGitHub(){
  if (gh.busy || !isAdmin()) return;
  if (!ghToken()) return toast('Paste a GitHub token first.');
  if (!(window.crypto && crypto.subtle)) return toast('This browser cannot push. Try Chrome or Safari.');
  gh = { busy: 'Saving…', msg:'', err:'', url:'' }; refreshGh();
  try {
    if (hasDraft()) await saveDraft();
    gh.busy = 'Checking GitHub…'; refreshGh();
    const ref = await ghApi('/git/ref/heads/main'), head = ref.object.sha, base = await ghApi('/git/commits/'+head);
    const tree = await ghApi('/git/trees/'+base.tree.sha+'?recursive=1'), have = new Map((tree.tree || []).map(t => [t.path, t.sha]));
    const changed = [];
    for (const f of ghFiles()) if (have.get(f.path) !== await gitSha(f.bytes)) changed.push(f);
    if (!changed.length) { gh = { busy:'', msg:'Everything is already on GitHub. Nothing to push.', err:'', url:'' }; return refreshGh(); }
    const entries = [];
    for (let i = 0; i < changed.length; i++) {
      gh.busy = 'Uploading '+(i+1)+' of '+changed.length+'…'; refreshGh();
      const blob = await ghApi('/git/blobs', { method:'POST', body: JSON.stringify({ content: bytesB64(changed[i].bytes), encoding:'base64' }) });
      entries.push({ path: changed[i].path, mode:'100644', type:'blob', sha: blob.sha });
    }
    gh.busy = 'Saving on GitHub…'; refreshGh();
    const t = await ghApi('/git/trees', { method:'POST', body: JSON.stringify({ base_tree: base.tree.sha, tree: entries }) });
    const photos = changed.filter(f => f.path.startsWith('images/')).length;
    const message = 'From the app: '+(photos ? photos+' photo'+(photos>1?'s':'')+(changed.length > photos ? ' and settings backup' : '') : 'settings backup')+' ('+(me||'admin')+')';
    const c = await ghApi('/git/commits', { method:'POST', body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
    await ghApi('/git/refs/heads/main', { method:'PATCH', body: JSON.stringify({ sha: c.sha }) });
    gh = { busy:'', err:'', msg:'Pushed '+changed.length+' file'+(changed.length>1?'s':'')+' to GitHub'+(photos ? ' ('+photos+' photo'+(photos>1?'s':'')+')' : '')+'. The website updates in about a minute.', url: c.html_url || ('https://github.com/'+ghRepo()+'/commit/'+c.sha) };
  } catch(e) { gh = { busy:'', msg:'', err: (e && e.message) || 'Push failed.', url:'' }; }

}

function setupScratch(){
  const cv = $('#scratchcv'); if (!cv) return;
  const box = $('#scard'), rect = box.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(rect.width*dpr); cv.height = Math.round(rect.height*dpr);
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const g = ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#B9C2C0'); g.addColorStop(.5,'#E3E8E6'); g.addColorStop(1,'#A9B3B1');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${Math.round(H*.13)}px "Bricolage Grotesque", system-ui, sans-serif`; ctx.fillText('SCRATCH HERE', W/2, H/2 - H*.05);
  ctx.font = `600 ${Math.round(H*.07)}px Figtree, system-ui, sans-serif`; ctx.fillText('to reveal your role', W/2, H/2 + H*.1);
  let down = false, last = null, moves = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };

  const cleared = () => { const d = ctx.getImageData(0,0,W,H).data; let n = 0, c = 0; for (let i = 3; i < d.length; i += 4*37) { n++; if (d[i] < 40) c++; } return c/n; };
  cv.addEventListener('pointerdown', async e => {
    if (readOnly) return toast('View only.');
    down = true; last = pos(e); cv.setPointerCapture(e.pointerId); rub(last,last);
    if (!scratch.res && !scratch.busy) {
      if (!demo && !navigator.onLine) { down = false; return toast('Connect to the internet to scratch, so two people can\'t get the same spot.'); }
      scratch.busy = true; scratch.lock = true; unlockAudio();
      try { scratch.res = await claimSpot('scratch'); } catch(err) { scratch.busy = false; scratch.lock = false; writeErr(err); return render(true); }
      scratch.busy = false;
      if (scratch.res.already) { scratch = SCRATCH0(); toast('You have already picked for next week.'); return render(true); }
      const u = $('#under'), res = scratch.res;
      if (u) u.innerHTML = res.forbidden ? `<small>Spot ${res.land+1}</small><b>${esc(spotName(res.land))}</b><span>Same as last week. Not allowed</span>` : `<small>Your spot for next week</small><b>${esc(spotName(res.land))}</b><span>Spot ${res.land+1}</span>`;
    }
  });

  }
}

  if (quietMoment() && !waiting) { if (b) b.hidden = true; SS.set('dutyRoster.upd', updateTo+'|'+Date.now()); toast('Updating to the new version…'); setTimeout(reloadFresh, 1500); return; }
  if (b) { b.hidden = false; b.textContent = 'New version ready · Update'; }
  updT = setTimeout(tryUpdate, 30000);
}
// The phone keeps a copy of the page for a fast start; drop it so the reload fetches the new version.
async function reloadFresh(){ try { const c = await caches.open('alainbc-v1'); await c.delete(new URL('index.html', location.href).href); } catch(e) {} location.reload(); }
setTimeout(checkUpdate, 4000); setInterval(checkUpdate, 5*60000);
window.addEventListener('online', checkUpdate);

/* ---------- live clock ---------- */
function updateLive(){
  document.querySelectorAll('[data-clock]').forEach(el => el.innerHTML = clockText(new Date()));
  const now = Date.now(); document.querySelectorAll('[data-cd]').forEach(el => el.textContent = fmtCd(+el.dataset.cd - now));
  const a = document.querySelector('[data-audio]'); if (a) { const ok = audioReady(); a.className = 'pill '+(ok?'ok':'warn'); a.textContent = ok ? 'Alert sound on · '+(+C().leadMin||3)+' min before each change' : 'Tap anywhere to turn on the alert sound'; }
}
let lastSig = '';
function tickNow(){
  const now = new Date(); if (dbState === 'ready') checkAlerts(now);
  if (bannerData && now.getTime() > bannerData.hideAt) { bannerData = null; clearInterval(alarmT); renderBanner(); }
  const t = nowMin(now); let sig = dkey(now)+'|';
  if (cfg && staff().length) { const sl = allSlots(dayRoster(sod(now))); sig += sl.filter(s => s.start <= t).length+'|'+sl.filter(s => s.end <= t).length; }
  if (cfg) sig += '|'+pickWindow().open;
  if (sig !== lastSig) { const first = !lastSig; if (lastSig && lastSig.slice(0,10) !== sig.slice(0,10)) { showPast = false; queueLock(); } lastSig = sig; if (!first && tab !== 'settings' && !spin.anim && !scratch.lock) render(); }
  updateLive();
}
setInterval(tickNow, 1000);
setInterval(queueLock, 5*60000); // safety net: a day that couldn't be fixed yet (offline, unsaved admin changes) is tried again
setInterval(renderHeader, 15000);
window.addEventListener('online', () => { renderHeader(); updateLive(); });
window.addEventListener('offline', () => { renderHeader(); if (!demo) toast('You are offline. Changes will save when the connection is back.'); });
loadSnap();
applyMyTheme();
render(true);
startDb();
</script>
